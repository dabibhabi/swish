# Windshield wipers (tasks/todo.md "Rigged Porsche" S1b). Baked to build/config/wiper.bin by
# `toml_baker wiper` (src/scene/Entity/WiperConfig.h); release reads only the bake. Debug builds
# tune the same values live (src/debug/Tunables.def, group "wiper").
#
# V cycles Off -> Intermittent -> Low -> High -> Off. One wipe = park -> top -> park.

[wiper]
low_wipes_per_min    = 45.0   # Low, and the speed of an Intermittent / parking wipe
high_wipes_per_min   = 65.0
intermittent_dwell_s = 4.0    # pause at park between Intermittent wipes
sweep_deg            = 105.0  # park -> top; the rigged 993 blades leave the glass past ~120
ease                 = 1.0    # 0 = constant angular speed, 1 = cosine (blades slow into each reversal)
